name: Publish

# `npm i -g @glyphh-ai/cli` needs @glyphh/sdk on the registry first: the CLI
# depends on it and npm installs both. A tag `v*` publishes the SDK at the
# version in package.json. Needs the NPM_TOKEN secret (an npm automation token
# for the @glyphh scope).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm i -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The tag must be the package version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || { echo "tag ${GITHUB_REF_NAME} is not v${v}"; exit 1; }
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
